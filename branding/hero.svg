<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Prime-OS: an Achaemenid colonnade with a winged disc">
  <rect width="1200" height="320" fill="#0B1020"/>
  <g fill="#14213D">
    <rect x="0" y="0" width="1200" height="320"/>
  </g>

  <!-- ground line and three-step stair, Persepolis style -->
  <g fill="#1B2A4A">
    <rect x="0" y="268" width="1200" height="52"/>
    <rect x="0" y="262" width="1200" height="6" fill="#24406B"/>
  </g>

  <!-- colonnade: five fluted shafts with double-volute capitals -->
  <g stroke="#8C6B1F" stroke-width="1.5" fill="none">
    <g id="column">
      <rect x="-14" y="120" width="28" height="142" fill="#16233F" stroke="#24406B"/>
      <line x1="-7" y1="124" x2="-7" y2="258" stroke="#1F3355"/>
      <line x1="0" y1="124" x2="0" y2="258" stroke="#1F3355"/>
      <line x1="7" y1="124" x2="7" y2="258" stroke="#1F3355"/>
      <rect x="-22" y="108" width="44" height="12" fill="#14213D" stroke="#D4A537"/>
      <path d="M-22 108 C-30 100 -30 88 -14 88 C-6 88 -4 94 0 94 C4 94 6 88 14 88 C30 88 30 100 22 108" stroke="#D4A537" fill="none"/>
      <rect x="-18" y="256" width="36" height="8" fill="#14213D" stroke="#D4A537"/>
    </g>
    <use href="#column" x="150"/>
    <use href="#column" x="330"/>
    <use href="#column" x="510"/>
    <use href="#column" x="870"/>
    <use href="#column" x="1050"/>
  </g>

  <!-- winged disc in the central opening -->
  <g fill="#D4A537" transform="translate(600 150)">
    <circle cx="0" cy="0" r="13"/>
    <path d="M-14 -4 C-46 -16 -86 -12 -112 0 C-86 6 -46 6 -14 4 Z"/>
    <path d="M14 -4 C46 -16 86 -12 112 0 C86 6 46 6 14 4 Z"/>
    <path d="M-104 2 l-12 10 l12 -2 z"/>
    <path d="M104 2 l12 10 l-12 -2 z"/>
    <rect x="-4" y="12" width="8" height="26"/>
    <path d="M-14 38 l14 12 l14 -12 z"/>
  </g>

  <!-- tribute frieze under the marks -->
  <g fill="#D4A537" opacity="0.9">
    <rect x="470" y="212" width="260" height="2"/>
  </g>
  <g fill="#8C6B1F">
    <rect x="470" y="218" width="18" height="3"/><rect x="494" y="218" width="18" height="3"/>
    <rect x="518" y="218" width="18" height="3"/><rect x="542" y="218" width="18" height="3"/>
    <rect x="566" y="218" width="18" height="3"/><rect x="590" y="218" width="18" height="3"/>
    <rect x="614" y="218" width="18" height="3"/><rect x="638" y="218" width="18" height="3"/>
    <rect x="662" y="218" width="18" height="3"/><rect x="686" y="218" width="18" height="3"/>
    <rect x="710" y="218" width="18" height="3"/>
  </g>
</svg>
