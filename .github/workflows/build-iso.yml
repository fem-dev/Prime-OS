name: Build and publish ISO

# Builds the Arch-based live image in a privileged Docker container, then uploads
# os.iso plus os.iso.sha256 to a GitHub release. Start it from the Actions tab
# ("Run workflow") or by pushing a v* tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (created if it does not exist)
        required: true
        default: os-preview
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "profile/**"
      - "build.sh"
      - "build.ps1"
      - "run-windows.sh"
      - ".github/workflows/build-iso.yml"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  # A newer commit supersedes a stale build instead of queueing behind it.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # A manual run uses the tag you type, a v* tag push uses the tag name, and a
      # push to main refreshes the rolling os-preview release.
      TAG: ${{ inputs.tag || (github.ref_type == 'tags' && github.ref_name || 'os-preview') }}
      # 'false' is decided in the shell: an empty string is falsy in Actions
      # expressions, so an && || chain would always add --prerelease.
      PRERELEASE_INPUT: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          df -h /

      - name: Build the live image
        # One progress bar with a heartbeat; the full log is kept in build.log.
        # mkarchiso compresses the airootfs with xz, which is the long step.
        run: |
          timeout --signal=INT 100m \
            python3 .github/scripts/build_iso_progress.py --log build.log -- \
              docker run --rm --privileged \
                -e PRIME_OS_BUILD_CONTAINER=1 \
                -v "$PWD:/work" -w /work archlinux:latest \
                bash -lc 'pacman -Syu --noconfirm archiso >/dev/null 2>&1 && bash ./build.sh'

      - name: Check the image
        run: |
          ls -lh out/os.iso
          file out/os.iso
          size=$(stat -c%s out/os.iso)
          echo "os.iso is $((size / 1024 / 1024)) MiB"
          test "$size" -gt 209715200 # refuse to publish an obviously truncated image

      - name: Take ownership of the build output
        # The container runs as root, so out/ is root-owned: without this the runner
        # cannot write os.iso.sha256 next to the image.
        run: |
          sudo chown -R "$(id -u):$(id -g)" out .build 2>/dev/null || true
          ls -l out/

      - name: Free the build workspace
        # .build/work holds the unpacked rootfs and the squashfs image; dropping it
        # keeps the checksum, artifact upload and release upload from running out of
        # disk. Only out/os.iso is still needed.
        run: |
          du -sh .build 2>/dev/null || true
          rm -rf .build || sudo rm -rf .build
          df -h /

      - name: Write the checksum the setup wizard verifies
        run: |
          set -x
          ls -l out/
          df -h .
          cd out
          sha256sum os.iso > os.iso.sha256
          cat os.iso.sha256
          df -h .
          {
            echo "### Prime-OS image built"
            echo "- image: $(du -h os.iso | cut -f1)"
            echo "- sha256: \`$(cut -d' ' -f1 os.iso.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build log and image as artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prime-os-iso
          if-no-files-found: warn
          path: |
            out/os.iso
            out/os.iso.sha256
            build.log

      - name: Explain the failure
        # Public diagnostics: step logs need authentication, this summary does not.
        if: failure()
        run: |
          {
            echo "### Build failed"
            echo '```'
            echo "--- disk ---"; df -h / . 2>&1 || true
            echo "--- out/ ---"; ls -l out/ 2>&1 | head -20 || true
            echo "--- workspace ---"; du -sh .build 2>&1 | head -3 || true
            echo "--- tail of build.log ---"
            tail -n 60 build.log 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An empty string is falsy in Actions expressions, so decide here.
          if [ "${PRERELEASE_INPUT}" = "false" ]; then
            prerelease=""
          else
            prerelease="--prerelease"
          fi
          notes=$(cat <<'NOTES'
          Prime-OS live image, built by GitHub Actions.

          Boot it in a virtual machine or write it to a spare USB drive, then verify the download:

              sha256sum -c os.iso.sha256
          NOTES
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/os.iso out/os.iso.sha256 --clobber
          else
            gh release create "$TAG" out/os.iso out/os.iso.sha256 \
              --title "Prime-OS $TAG" --notes "$notes" $prerelease
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
