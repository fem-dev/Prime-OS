name: Build and publish ISO

# Builds the Arch-based live image in a privileged Docker container, then uploads
# os.iso plus os.iso.sha256 to a GitHub release.
# Start it from the Actions tab ("Run workflow") or by pushing a v* tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (created if it does not exist)
        required: true
        default: os-preview
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true
      groups:
        description: "Package groups to include, space-separated (empty = default slim set, 'all' = everything)"
        required: false
        default: ""
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "profile/**"
      - "build.sh"
      - "build.ps1"
      - "run-windows.sh"
      - ".github/workflows/build-iso.yml"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  # A newer commit supersedes a stale build instead of queueing behind it.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # A manual run uses the tag you type, a v* tag push uses the tag name, and a
      # push to main refreshes the rolling os-preview release.
      TAG: ${{ inputs.tag || (github.ref_type == 'tags' && github.ref_name || 'os-preview') }}
      PRERELEASE_INPUT: ${{ inputs.prerelease }}
      # Each component of the image is its own list under profile/packages;
      # build.sh merges only the groups named here (empty string = default set,
      # which leaves out NVIDIA, the 32-bit libraries and CJK fonts).
      PRIME_OS_GROUPS: ${{ inputs.groups }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          df -h /

      - name: Build the live image
        # One progress bar with a heartbeat; the full log is kept in build.log.
        # mkarchiso compresses the airootfs with xz, which is the long step.
        run: |
          timeout --signal=INT 100m \
            python3 .github/scripts/build_iso_progress.py --log build.log -- \
              docker run --rm --privileged \
                -e PRIME_OS_BUILD_CONTAINER=1 \
                -v "$PWD:/work" -w /work archlinux:latest \
                bash -lc 'pacman -Syu --noconfirm archiso >/dev/null 2>&1 && bash ./build.sh'

      - name: Check the image
        run: |
          echo "package groups: $(cat out/groups.txt 2>/dev/null || echo 'unknown')"
          echo "### Package groups: \`$(cat out/groups.txt 2>/dev/null || echo unknown)\`" >> "$GITHUB_STEP_SUMMARY"
          ls -lh out/os.iso
          file out/os.iso
          size=$(stat -c%s out/os.iso)
          echo "os.iso is $((size / 1024 / 1024)) MiB"
          # Verify ISO is not empty and has reasonable size (>= 100MiB, <= 2.5GiB)
          if [ "$size" -lt 104857600 ]; then
            echo "::error::ISO too small (< 100MiB), likely build failed"
            exit 1
          fi
          if [ "$size" -gt 2621440000 ]; then
            echo "::warning::ISO larger than 2.5GiB, release upload may fail due to GitHub 2GiB asset limit"
          fi

      - name: Take ownership of the build output
        # The container runs as root, so out/ is root-owned: without this the runner
        # cannot write os.iso.sha256 next to the image.
        run: |
          sudo chown -R "$(id -u):$(id -g)" out .build 2>/dev/null || true
          ls -l out/

      - name: Free the build workspace
        # .build/work holds the unpacked rootfs and the squashfs image; dropping it
        # keeps the checksum, artifact upload and release upload from running out of disk.
        # Only out/os.iso is still needed.
        run: |
          du -sh .build 2>/dev/null || true
          sudo rm -rf .build 2>/dev/null || true
          df -h /

      - name: Write the checksum the setup wizard verifies
        run: |
          set -x
          ls -l out/
          df -h .
          cd out
          sha256sum os.iso > os.iso.sha256
          cat os.iso.sha256
          {
            echo "### Prime-OS image built"
            echo "- image: $(du -h os.iso | cut -f1)"
            echo "- sha256: \`$(cut -d' ' -f1 os.iso.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build log and image as artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prime-os-iso
          if-no-files-found: warn
          path: |
            out/os.iso
            out/os.iso.sha256
            build.log

      - name: Explain the failure (on build failure only)
        # Public diagnostics: step logs need authentication, this summary does not.
        if: failure()
        run: |
          {
            echo "### Build failed"
            echo '```'
            echo "--- disk ---"; df -h / . 2>&1 || true
            echo "--- out/ ---"; ls -l out/ 2>&1 | head -20 || true
            echo "--- workspace ---"; du -sh .build 2>&1 | head -3 || true
            echo "--- tail of build.log ---"
            tail -n 60 build.log 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the image (single asset or parts)
        # GitHub refuses a release asset of 2 GiB or more and the live image is
        # larger than that, which is why nothing was ever published. A large image
        # is now published as numbered parts plus one small manifest that the setup
        # wizard reads and joins, so the download needs no external hosting.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${TAG:-os-preview}"
          PRERELEASE_FLAG="--prerelease"
          if [ "${PRERELEASE_INPUT:-true}" = "false" ]; then PRERELEASE_FLAG=""; fi

          MAX_ASSET_BYTES=2147483648
          ISO_BYTES=$(stat -c%s out/os.iso)
          FULL_SHA=$(cut -d' ' -f1 out/os.iso.sha256)
          rm -rf upload && mkdir -p upload

          if [ "$ISO_BYTES" -lt "$MAX_ASSET_BYTES" ]; then
            echo "Image is $((ISO_BYTES / 1024 / 1024)) MiB: publishing one asset."
            cp out/os.iso upload/os.iso
            cp out/os.iso.sha256 upload/os.iso.sha256
            MODE=single
          else
            echo "Image is $((ISO_BYTES / 1024 / 1024)) MiB: publishing parts."
            split -b 1700M -d -a 2 --numeric-suffixes=1 out/os.iso upload/os.iso.part
            python3 .github/scripts/write_parts_manifest.py upload "$ISO_BYTES" "$FULL_SHA"
            MODE=parts
          fi
          ls -lh upload/

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" upload/* --clobber
          else
            gh release create "$TAG" upload/* \
              --title "Prime-OS $TAG" \
              --notes "Prime-OS live image, built by GitHub Actions. Verify with: sha256sum -c os.iso.sha256" \
              $PRERELEASE_FLAG
          fi

          # Remove the assets of the other layout so the wizard can never pick a
          # stale copy of the image.
          if [ "$MODE" = parts ]; then
            for stale in os.iso os.iso.sha256; do
              gh release delete-asset "$TAG" "$stale" -y >/dev/null 2>&1 || true
            done
          else
            for stale in $(gh release view "$TAG" --json assets --jq '.assets[].name' \
                | grep '^os\.iso\.part' || true); do
              gh release delete-asset "$TAG" "$stale" -y >/dev/null 2>&1 || true
            done
            gh release delete-asset "$TAG" os-iso-parts.json -y >/dev/null 2>&1 || true
          fi

          {
            echo "### Published $TAG ($MODE)"
            echo "- image: $((ISO_BYTES / 1024 / 1024)) MiB"
            echo "- sha256: \`$FULL_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "- \(.name) \(.size) B"' >> "$GITHUB_STEP_SUMMARY" || true
