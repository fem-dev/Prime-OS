name: Build and publish ISO

# Builds the Arch-based live image in a privileged Docker container, then uploads
# os.iso plus os.iso.sha256 to a GitHub release.
# Start it from the Actions tab ("Run workflow") or by pushing a v* tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (created if it does not exist)
        required: true
        default: os-preview
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "profile/**"
      - "build.sh"
      - "build.ps1"
      - "run-windows.sh"
      - ".github/workflows/build-iso.yml"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  # A newer commit supersedes a stale build instead of queueing behind it.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # A manual run uses the tag you type, a v* tag push uses the tag name, and a
      # push to main refreshes the rolling os-preview release.
      TAG: ${{ inputs.tag || (github.ref_type == 'tags' && github.ref_name || 'os-preview') }}
      # 'false' is decided in the shell: an empty string is falsy in Actions
      # expressions, so an && || chain would always add --prerelease.
      PRERELEASE_INPUT: ${{ inputs.prerelease }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          df -h /

      - name: Build the live image
        # One progress bar with a heartbeat; the full log is kept in build.log.
        # mkarchiso compresses the airootfs with xz, which is the long step.
        run: |
          timeout --signal=INT 100m \
            python3 .github/scripts/build_iso_progress.py --log build.log -- \
              docker run --rm --privileged \
                -e PRIME_OS_BUILD_CONTAINER=1 \
                -v "$PWD:/work" -w /work archlinux:latest \
                bash -lc 'pacman -Syu --noconfirm archiso >/dev/null 2>&1 && bash ./build.sh'

      - name: Check the image
        run: |
          ls -lh out/os.iso
          file out/os.iso
          size=$(stat -c%s out/iso)
          echo "os.iso is $((size / 1024 / 1024)) MiB"
          # Verify ISO is not empty and has reasonable size (>= 100MiB, <= 2.5GiB)
          if [ "$size" -lt 104857600 ]; then
            echo "::error::ISO too small (< 100MiB), likely build failed"
            exit 1
          fi
          if [ "$size" -gt 2621440000 ]; then
            echo "::warning::ISO larger than 2.5GiB, release upload may fail due to GitHub 2GiB asset limit"
          fi

      - name: Write the checksum the setup wizard verifies
        run: |
          set -x
          ls -l out/
          df -h .
          cd out
          sha256sum os.iso > os.iso.sha256
          cat os.iso.sha256
          df -h .
          {
            echo "### Prime-OS image built"
            echo "- image: $(du -h os.iso | cut -f1)"
            echo "- sha256: \`$(cut -d' ' -f1 os.iso.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the build log and image as artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prime-os-iso
          if-no-files-found: warn
          path: |
            out/os.iso
            out/os.iso.sha256
            build.log

      - name: Explain the failure (on build failure only)
        # Public diagnostics: step logs need authentication, this summary does not.
        if: failure()
        run: |
          {
            echo "### Build failed"
            echo '```'
            echo "--- disk ---"; df -h / . 2>&1 || true
            echo "--- out/ ---"; ls -l out/ 2>&1 | head -20 || true
            echo "--- workspace ---"; du -sh .build 2>&1 | head -3 || true
            echo "--- tail of build.log ---"
            tail -n 60 build.log 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Conditionally publish the release
        # Only publish to release if ISO size is within GitHub 2GiB asset limit.
        # Otherwise, skip release creation and keep artifact for manual download.
        env:
          ISO_SIZE_BYTES: ${{ env.ISO_SIZE || 0 }}
          TAG: ${{ inputs.tag || (github.ref_type == 'tags' && github.ref_name || 'os-preview') }}
          PRERELEASE_FLAG: ""
        run: |
          # Get actual ISO size in bytes
          if [ -f out/os.iso ]; then
            ISO_BYTES=$(stat -c%s out/os.iso)
          else
            ISO_BYTES=0
          fi
          TAG="${TAG:-os-preview}"
          PRERELEASE="${PRERELEASE_INPUT:-true}"

          if [ "$PRERELEASE" = "false" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # GitHub release asset limit is 2 GiB (2147483648 bytes)
          MAX_ASSET_BYTES=2147483648

          if [ "$ISO_BYTES" -le "$MAX_ASSET_BYTES" ]; then
            # ISO is small enough - proceed with release creation/upload
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" out/os.iso out/os.iso.sha256 --clobber
            else
              notes=$(cat <<'NOTES'
              Prime-OS live image, built by GitHub Actions.

              Boot it in a virtual machine or write it to a spare USB drive, then verify the download:

                sha256sum -c os.iso.sha256
              NOTES
              )
              gh release create "$TAG" out/os.iso out/os.iso.sha256 \
                --title "Prime-OS $TAG" --notes "$notes" $PRERELEASE_FLAG
            fi
            gh release view "$TAG" --json assets --jq '.assets[].name' >> "$GITHUB_STEP_SUMMARY"
            echo "Release $TAG published successfully with ISO asset ($((ISO_BYTES / 1024 / 1024)) MiB)" >> "$GITHUB_STEP_SUMMARY"
          else
            # ISO too large for GitHub release assets - skip release creation
            echo "::warning::ISO size ($((ISO_BYTES / 1024 / 1024)) MiB) exceeds GitHub 2 GiB release asset limit."
            echo "::skip-summary::"
            echo "ISO is too large for GitHub Release asset. Artifacts are still available for manual download." >> "$GITHUB_STEP_SUMMARY"
            echo "To publish this ISO, consider:" >> "$GITHUB_STEP_SUMMARY"
            echo "1. Creating a release manually outside of GitHub Actions" >> "$GITHUB_STEP_SUMMARY"
            echo "2. Using external file hosting (e.g., transfer.sh)" >> "$GITHUB_STEP_SUMMARY"
            echo "3. Reducing ISO size by removing packages from profile/packages.x86_64" >> "$GITHUB_STEP_SUMMARY"
            echo "The ISO and checksum are available as artifacts for download." >> "$GITHUB_STEP_SUMMARY"
          fi