# Prime-OS — Hyprland session
#
# Colour words used below map to branding/palette.json:
#   basalt #0B1020 · lapis #14213D · gold #D4A537 · gold-bright #F0C75E
#
# No image file is shipped: the desktop paints itself in solid basalt, so the
# session has no wallpaper to break, resize or look wrong.

monitor = , preferred, auto, 1

$mod = SUPER
$terminal = kitty
$launcher = wofi --show drun

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = swaybg -c '#0B1020'
exec-once = waybar
exec-once = dunst
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(D4A537ff) rgba(8C6B1Fff) 45deg
    col.inactive_border = rgba(14213Dff)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 6
    active_opacity = 1.0
    inactive_opacity = 0.96
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(0B1020aa)
    }
    blur {
        enabled = true
        size = 4
        passes = 2
    }
}

animations {
    enabled = true
    bezier = prime, 0.2, 0.9, 0.2, 1.0
    animation = windows, 1, 5, prime
    animation = windowsOut, 1, 4, prime, popin 85%
    animation = fade, 1, 5, prime
    animation = workspaces, 1, 5, prime
}

dwindle {
    pseudotile = true
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# === session ================================================================
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $launcher
bind = $mod, B, exec, firefox
bind = $mod, E, exec, pcmanfm
bind = $mod, N, exec, $terminal -e nmtui
bind = $mod, P, exec, pavucontrol
bind = $mod, slash, exec, $terminal -e less /usr/share/prime-os/keys.txt
bind = $mod, Q, killactive,
bind = $mod, M, exit,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen, 0
bind = $mod, J, togglesplit,

# === screenshots ============================================================
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod, Print, exec, grim - | wl-copy

# === windows ================================================================
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# === workspaces =============================================================
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# === hardware ===============================================================
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
