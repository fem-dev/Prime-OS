# Prime-OS — initial Hyprland live-session configuration
# Optimized for broad GPU compatibility (AMD, Intel, NVIDIA open drivers)
$mod = SUPER

# Monitor configuration - auto-detect with preferred refresh rate
monitor = , preferred, auto, 1

# Experimental variables for compatibility
$mainmonitor = 1
$border_size = 2
$gaps_in = 6
$gaps_out = 8

exec-once = waybar
exec-once = dunst
exec-once = pipewire
exec-once = wireplumber

# Input configuration
input {
    kb_layout = us
    follow_mouse = 1
    # Sensitivity disabled by default; enable if needed per hardware
    sensitivity = 0
}

# General layout and styling
general {
    # Color palette for broad compatibility (no neon/oxymoron colors)
    col.active_border = rgba(79d9ffff) rgba(8b5cf6ff) 45deg
    col.inactive_border = rgba(334155aa)
    # Use 'dwindle' layout for maximum screen real estate
    layout = dwindle
    # Resize content when moving border
    resize_on_border = true
    # Gaps settings
    gaps_in = 6
    gaps_out = 8
    # Border size
    border_size = 2
}

# Window decoration
decoration {
    # Rounded corners for modern look
    rounding = 12
    # Opacity settings for performance
    active_opacity = 1.0
    inactive_opacity = 0.96
    # Blur effect - disabled by default for maximum compatibility
    # Enable if your GPU driver supports it (AMD Vulkan, Intel open source, NVIDIA open)
    blur {
        enabled = no
        size = 5
        passes = 2
        ignore_opacity = true
    }
    # Shadow configuration
    shadow {
        enabled = yes
        range = 16
        render_power = 3
        color = rgba(00000066)
    }
}

# Animations - kept but reduced for performance
animations {
    enabled = yes
    # Bezier curve for smooth easing
    bezier = prime, 0.16, 1, 0.3, 1
    # Window show/hide animations
    animation = windows, 1, 5, prime, popin 85%
    animation = windowsOut, 1, 4, prime, popin 85%
    # Border animation
    animation = border, 1, 5, prime
    # Fade animation for transparency effects
    animation = fade, 1, 4, prime
    # Workspace slide animation
    animation = workspaces, 1, 5, prime, slide
}

# Window management modes
dwindle {
    # Pseudotile mode for flexible window placement
    pseudotile = yes
    # Preserve split ratios when resizing
    preserve_split = yes
}

# === Applications ===
