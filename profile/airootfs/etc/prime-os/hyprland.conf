# Prime-OS live session — Persepolis theme
# Palette: branding/palette.json (basalt #0B1020, lapis #14213D, gold #D4A537)
# Blur and heavy effects stay off so the session starts on modest GPUs and VMs.
$mod = SUPER

monitor = , preferred, auto, 1

$border_size = 2
$gaps_in = 6
$gaps_out = 8

# The live session runs these; every one of them ships in the desktop group.
exec-once = waybar
exec-once = dunst
exec-once = swaybg -i /usr/share/backgrounds/prime-os.jpg -m fill
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = no
    }
}

general {
    # Gold on lapis, like a glazed brick frieze
    col.active_border = rgba(D4A537ff) rgba(8C6B1Fff) 45deg
    col.inactive_border = rgba(24406Baa)
    layout = dwindle
    resize_on_border = true
    gaps_in = 6
    gaps_out = 8
    border_size = 2
}

decoration {
    rounding = 4
    active_opacity = 1.0
    inactive_opacity = 0.96
    blur {
        enabled = no
    }
    shadow {
        enabled = yes
        range = 16
        render_power = 3
        color = rgba(0B102066)
    }
}

animations {
    enabled = yes
    bezier = prime, 0.16, 1, 0.3, 1
    animation = windows, 1, 5, prime, popin 85%
    animation = windowsOut, 1, 4, prime, popin 85%
    animation = border, 1, 5, prime
    animation = fade, 1, 4, prime
    animation = workspaces, 1, 5, prime, slide
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

# === Applications ===
bind = $mod, RETURN, exec, kitty
bind = $mod, D, exec, wofi --show drun
bind = $mod, B, exec, firefox
bind = $mod, E, exec, pcmanfm
bind = $mod, N, exec, kitty -e nmtui
# Steam is not part of the image; offer it only when the user installed it.
bind = $mod, G, exec, sh -c 'command -v steam >/dev/null 2>&1 && exec steam || notify-send "Prime-OS" "Steam is not installed in this image."'

# === Window management ===
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, M, exit

# === Focus and workspaces ===
bind = $mod, LEFT, movefocus, l
bind = $mod, RIGHT, movefocus, r
bind = $mod, UP, movefocus, u
bind = $mod, DOWN, movefocus, d

bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r

# Screenshots land in the home folder; grim and slurp are in the desktop group.
bind = , PRINT, exec, grim -g "$(slurp)" ~/screenshot-$(date +%s).png
