# Prime-OS — initial Hyprland live-session configuration
$mod = SUPER

env = XDG_SESSION_TYPE,wayland
env = GDK_BACKEND,wayland,x11

monitor = , preferred, auto, 1

exec-once = waybar
exec-once = dunst

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(79d9ffff) rgba(8b5cf6ff) 45deg
    col.inactive_border = rgba(334155aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.96
    blur {
        enabled = yes
        size = 5
        passes = 2
        ignore_opacity = true
    }
    shadow {
        enabled = yes
        range = 16
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = yes
    bezier = prime, 0.16, 1, 0.3, 1
    animation = windows, 1, 5, prime, popin 85%
    animation = windowsOut, 1, 4, prime, popin 85%
    animation = border, 1, 5, prime
    animation = fade, 1, 4, prime
    animation = workspaces, 1, 5, prime, slide
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

bind = $mod, RETURN, exec, kitty
bind = $mod, D, exec, wofi --show drun
bind = $mod, B, exec, firefox
bind = $mod, G, exec, steam
bind = $mod, N, exec, nm-connection-editor
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, M, exit
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, LEFT, movefocus, l
bind = $mod, RIGHT, movefocus, r
bind = $mod, UP, movefocus, u
bind = $mod, DOWN, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
